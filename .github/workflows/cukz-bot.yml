name: cukz-bot

# Deploys the Cardiff Kazakhstan timetable Telegram bot to Cloudflare Workers.
# The bot downloads timetable updates itself (see cukz-bot/src/worker.js).
on:
  push:
    branches: [main]
    paths: ['cukz-bot/**', '.github/workflows/cukz-bot.yml']
  workflow_dispatch:

concurrency: cukz-bot

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

jobs:
  bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cukz-bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cukz-bot/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Deploy worker and connect Telegram
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$TELEGRAM_TOKEN" ]; then
            echo "::notice::No Cloudflare/Telegram secrets, skipping deploy (deploy from a laptop with scripts/deploy.sh)."
          else
            ./scripts/deploy.sh
          fi
